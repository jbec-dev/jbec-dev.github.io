<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title></title>

<style>
  body {
    margin: 0;
    background: black;
    cursor: pointer;
  }

  #hint {
    position: absolute;
    color: #333;
    font-family: Arial, sans-serif;
    font-size: 14px;
    bottom: 20px;
    width: 100%;
    text-align: center;
  }

  video {
    display: none;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }
</style>
</head>

<body>

<div id="hint"></div>

<video id="rick" loop playsinline>
  <source src="https://jbec-dev.github.io/rickroll/rickroll.mp4" type="video/mp4">
</video>

<script>
const video = document.getElementById("rick");
const hint = document.getElementById("hint");

// click anywhere to start
document.body.addEventListener("click", async () => {
  document.body.style.background = "black";
  hint.style.display = "none";

  video.style.display = "block";

  try {
    await video.play();
  } catch (e) {
    video.controls = true;
  }
}, { once: true });
</script>

</body>
</html>
