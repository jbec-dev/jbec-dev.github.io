<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Door Control System</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #111;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    text-align: center;
    background: white;
    padding: 40px 50px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    width: 320px;
  }

  .logo {
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 20px;
    color: #d2001a; /* Hörmann-style red accent */
  }

  .spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #ddd;
    border-top: 5px solid #d2001a;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 20px auto;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  #status {
    font-size: 14px;
    color: #444;
    margin-top: 10px;
  }

  button {
    margin-top: 20px;
    padding: 10px 16px;
    border: none;
    background: #d2001a;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    display: none;
  }

  button:hover {
    background: #a80014;
  }

  video {
    display: none;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }
</style>
</head>

<body>

<div id="ui" class="card">
  <div class="logo">HÖRMANN DOOR CONTROL</div>
  <div class="spinner"></div>
  <div id="status">Initializing system...</div>
  <button id="unlock">Unlock Door</button>
</div>

<video id="rick" playsinline>
  <source src="https://jbec-dev.github.io/rickroll/rickroll.mp4" type="video/mp4">
</video>

<script>
const status = document.getElementById("status");
const btn = document.getElementById("unlock");
const ui = document.getElementById("ui");
const video = document.getElementById("rick");

const steps = [
  "Initializing system...",
  "Checking door motor...",
  "Verifying safety protocol...",
  "Connection stable",
  "Access granted"
];

let i = 0;

function run() {
  if (i < steps.length) {
    status.textContent = steps[i];
    i++;
    setTimeout(run, 800);
  } else {
    document.querySelector(".spinner").style.display = "none";
    btn.style.display = "inline-block";
  }
}

run();

btn.onclick = async () => {
  ui.style.display = "none";
  video.style.display = "block";

  try {
    await video.play();
  } catch (e) {
    video.controls = true;
  }
};
</script>

</body>
</html>
