<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading...</title>

<style>
  body {
    margin: 0;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }

  /* Spinner */
  .spinner {
    width: 60px;
    height: 60px;
    border: 6px solid #333;
    border-top: 6px solid white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  video {
    display: none;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
  }
</style>
</head>

<body>

<div id="loader" class="spinner"></div>

<video id="rick" playsinline>
  <source src="https://jbec-dev.github.io/rickroll/rickroll.mp4" type="video/mp4">
</video>

<script>
const loader = document.getElementById("loader");
const video = document.getElementById("rick");

// simulate loading delay
setTimeout(async () => {
  loader.style.display = "none";
  video.style.display = "block";

  try {
    await video.play(); // will autoplay only if allowed by browser
  } catch (e) {
    video.controls = true; // fallback so user can press play
  }
}, 2000);
</script>

</body>
</html>
